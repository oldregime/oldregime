name: Update Chat SVG with 3D Graph

on:
  schedule:
    # Runs at 00:00 UTC daily
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "build_chat_svg.py"
      - "jason_chat.svg"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate GitHub Profile 3D Contrib
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Build Chat SVG
        run: python3 build_chat_svg.py
        
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chat.svg profile-3d-contrib/
          git diff --cached --quiet || git commit -m "chore: update 3D graph and chat.svg"
          git push
